[package]
name = "yeet"
version = "0.1.0"
edition = "2021"
default-run = "yeet"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["3d", "bevy_camera_controller", "free_camera", "jpeg", "audio", "bevy_dev_tools", "dynamic_linking"] }

bevy-inspector-egui = "*"
avian3d = { version = "0.8.0", features = [
    "diagnostic_ui",
    "collider-from-mesh",
    "bevy_scene",
    "serialize",
    "debug-plugin"
] }
avian_pickup = "0.7"
bevy_ahoy = "0.3"
bevy_enhanced_input = "0.27"
bevy_skein = "0.7"
bevy_console = { git = "https://github.com/Rakarake/bevy-console" }
clap = "*"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

# Suggested by bevy-rapier
[profile.release]
codegen-units = 1

